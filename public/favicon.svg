<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background circle with Cognitrail 5-Shade Ocean Blue gradient -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#003B73;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0265A6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6096BA;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bulbGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EBF3FA;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main circle background -->
  <circle cx="50" cy="50" r="48" fill="url(#grad1)"/>
  
  <!-- Lightbulb icon -->
  <g transform="translate(50, 50)">
    <!-- Bulb body -->
    <path d="M-15,-20 Q-15,-35 0,-35 Q15,-35 15,-20 Q15,-10 10,0 L-10,0 Q-15,-10 -15,-20 Z" 
          fill="url(#bulbGrad)" stroke="#ffffff" stroke-width="1"/>
    
    <!-- Base -->
    <rect x="-8" y="2" width="16" height="7" rx="2" fill="#EBF3FA"/>
    
    <!-- Bottom cap -->
    <rect x="-5" y="10" width="10" height="4" rx="2" fill="#6096BA"/>
    
    <!-- Light rays -->
    <line x1="-24" y1="-20" x2="-29" y2="-20" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="24" y1="-20" x2="29" y2="-20" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-17" y1="-31" x2="-21" y2="-35" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="17" y1="-31" x2="21" y2="-35" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="-40" x2="0" y2="-45" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  
  <!-- Outer Ring Glow -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="#6096BA" stroke-width="2" opacity="0.6"/>
</svg>
